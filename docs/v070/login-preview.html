<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V0.7.0 登录页设计预览</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8eef5;background:#0b1017}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;flex-direction:column}header{height:76px;display:flex;align-items:center;gap:12px;padding:0 clamp(24px,5vw,72px);border-bottom:1px solid #263445}header svg{width:32px}header small{margin-left:auto;color:#68798b;letter-spacing:2px}main{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:clamp(40px,8vw,120px);max-width:1220px;width:100%;margin:auto;padding:48px clamp(24px,5vw,72px)}.eyebrow{color:#4295ff;letter-spacing:2px;font-size:12px;font-weight:600}h1{font-size:clamp(36px,4vw,60px);line-height:1.25;margin:20px 0}p{color:#8193a8;line-height:1.6}.art{width:100%;max-width:440px;margin-top:20px}.card{width:100%;max-width:400px;margin:auto;padding:36px;background:#121b26;border:1px solid #263445;border-radius:12px}h2{font-size:26px;margin:0 0 6px}.card p{margin:0 0 28px;font-size:14px}label{display:block;font-size:14px;color:#c4d0df;margin:18px 0 8px}.field{display:flex;align-items:center;gap:10px;background:#0b121c;border:1px solid #304054;border-radius:8px;padding:0 12px;height:48px}.field:focus-within{border-color:#4295ff;box-shadow:0 0 0 2px #4295ff22}.field svg{width:18px;flex:none;color:#8193a8}input{min-width:0;width:100%;background:none;border:0;color:#e8eef5;font:inherit;outline:0}input::placeholder{color:#8193a8}button,select{font:inherit}button{cursor:pointer}.eye{background:none;border:0;color:#8193a8;padding:4px;display:flex}.submit{width:100%;height:48px;background:#347fe8;color:white;border:0;border-radius:8px;margin-top:24px;font-weight:600}.submit:hover{background:#4295ff}button:focus-visible,select:focus-visible{outline:2px solid #75b1ff;outline-offset:3px}.hint{text-align:center;color:#8193a8;font-size:12px;margin-top:20px}.message{color:#f3b678;font-size:13px;margin-top:12px}footer{text-align:center;color:#68798b;padding:24px;font-size:12px}.preview{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;background:#121b26;border-top:1px solid #263445;font-size:12px;color:#8193a8}select{background:#0b121c;color:#e8eef5;border:1px solid #304054;padding:6px;border-radius:6px}@media(max-width:760px){main{grid-template-columns:1fr;gap:0;padding:24px}.intro{display:none}.card{padding:28px}header{height:64px}header small{font-size:10px}footer{padding:16px}}@media(max-width:390px){main{padding:16px}.card{padding:22px}}
</style></head><body><header><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 29 9.5 29 23 16 30 3 23 3 9.5Z" fill="#4295ff" fill-opacity=".12" stroke="#4295ff" stroke-width="1.5"/><path d="m3 9.5 13 7 13-7 M16 16.5V30 M9.5 6 22.5 13.3V20" fill="none" stroke="#4295ff" stroke-width="1.5"/></svg><strong id="brand">基座工作台</strong><small>WORKSPACE</small></header><main><section class="intro"><div class="eyebrow">UNIFIED WORKSPACE</div><h1>让应用管理<br>更简单。</h1><p>统一入口，稳定运行，高效协作。</p><svg class="art" viewBox="0 0 320 190" aria-hidden="true"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#263d58" stroke-width=".6" opacity=".5"/></pattern><linearGradient id="cube"><stop stop-color="#438bfa" stop-opacity=".28"/><stop offset="1" stop-color="#438bfa" stop-opacity=".02"/></linearGradient></defs><rect width="320" height="190" fill="url(#grid)"/><g fill="none" stroke="#38567b" stroke-width=".7" opacity=".5"><path d="M40 140 160 76 280 140 160 190Z"/><path d="M53 146 160 82 267 146 160 187Z"/><path d="M66 152 160 88 254 152 160 184Z"/><path d="M79 158 160 94 241 158 160 181Z"/></g><path d="M160 26 225 62 160 100 95 62Z" fill="url(#cube)" stroke="#559dff" stroke-width="1.5"/><path d="M95 62 160 100 160 163 95 126Z" fill="#285589" fill-opacity=".18" stroke="#478de5"/><path d="M225 62 160 100 160 163 225 126Z" fill="#203c61" fill-opacity=".55" stroke="#478de5"/><path d="M160 10 246 58 246 137 160 184 74 137 74 58Z" stroke="#4577b2" stroke-dasharray="4 6" fill="none" opacity=".6"/><path d="M27 82H65L95 100M225 100 255 82H293M160 26V8" stroke="#4476b0" fill="none"/><g fill="#61a4ff"><circle cx="27" cy="82" r="3"/><circle cx="293" cy="82" r="3"/><circle cx="160" cy="8" r="3"/><circle cx="74" cy="137" r="3"/><circle cx="246" cy="137" r="3"/></g><path d="m136 63 24-13 24 13-24 14Z" fill="#4295ff" fill-opacity=".5" stroke="#7cb7ff"/></svg></section><section class="card"><h2>欢迎登录</h2><p>登录您的<span id="brand2">基座工作台</span></p><form id="demo" novalidate><label for="account">账号</label><div class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><input id="account" placeholder="请输入账号" autocomplete="off" required></div><label for="password">密码</label><div class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" type="password" placeholder="请输入密码" autocomplete="off" required><button class="eye" type="button" id="toggle" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path id="slash" d="M3 3l18 18" visibility="hidden"/></svg></button></div><button class="submit" type="submit">登录工作台　→</button><div id="message" class="message" role="status"></div></form><div class="hint">♧　仅限授权用户访问</div></section></main><footer>Powered by App Foundation</footer><div class="preview"><label for="brand-select" style="margin:0">设计预览 · 请使用虚构数据</label><select id="brand-select"><option>基座工作台</option><option>Office Panel</option><option>TI Stock Hunter</option><option>雄展数据采集</option></select></div><script>
const by=id=>document.getElementById(id);by('brand-select').addEventListener('change',e=>{by('brand').textContent=by('brand2').textContent=e.target.value});by('toggle').addEventListener('click',()=>{const show=by('password').type==='password';by('password').type=show?'text':'password';by('toggle').setAttribute('aria-label',show?'隐藏密码':'显示密码');by('toggle').setAttribute('aria-pressed',String(show));by('slash').setAttribute('visibility',show?'visible':'hidden')});by('demo').addEventListener('submit',e=>{e.preventDefault();by('message').textContent=by('account').value&&by('password').value?'当前仅为设计预览，不连接真实登录服务。':'请输入账号和密码';});</script></body></html>
